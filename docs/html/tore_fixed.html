// ------------------------------------------------------------
// Renderer / scene: orthographic camera gives the model a miniature
// collectible-diorama perspective instead of a conventional game view.
// ------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });

// ------------------------------------------------------------
// Proper toon ramp: a 256 x 1 horizontal grayscale ramp with hard
// bands and nearest filtering. This is the key correction to the old
// 4 x 256 vertical gradient texture.
// ------------------------------------------------------------
function makeToonRamp() {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 1;
  const ctx = canvas.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 256, 0);
  g.addColorStop(0.00, '#343b58');
  g.addColorStop(0.34, '#343b58');
  g.addColorStop(0.35, '#78839e');
  g.addColorStop(0.68, '#78839e');
  g.addColorStop(0.69, '#f2eddf');
  g.addColorStop(1.00, '#f2eddf');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 1);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  texture.generateMipmaps = false;
  return texture;
}
const toonRamp = makeToonRamp();

const palette = {
  ink: 0x20263d,
  cream: 0xe8e1d2,
  concrete: 0x626b7e,
  asphalt: 0x222a40,
  blue: 0x3d76a8,
  teal: 0x4c9e9a,
  warm: 0xffc879,
  pink: 0xf17b9b
};

function toon(color, extra = {}) {
  return new THREE.MeshToonMaterial({ color, gradientMap: toonRamp, ...extra });
}
function emissiveToon(color, emissive, intensity = 0.5, extra = {}) {
  return new THREE.MeshToonMaterial({
    color,
    gradientMap: toonRamp,
    emissive: new THREE.Color(emissive),
    emissiveIntensity: intensity,
    ...extra
  });
}
function basic(color, extra = {}) {
  return new THREE.MeshBasicMaterial({ color, ...extra });
}
function box(w, h, d, color, extra = {}, bevel = 0.055) {
  const radius = Math.max(0.001, Math.min(bevel, w * 0.19, h * 0.19, d * 0.19));
  const geometry = new RoundedBoxGeometry(w, h, d, 3, radius);
  const mesh = new THREE.Mesh(geometry, toon(color, extra));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function cylinder(rt, rb, h, color, segments = 12, extra = {}) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, segments), toon(color, extra));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function addBox(parent, size, position, color, extra = {}, bevel = 0.055) {
  const mesh = box(size[0], size[1], size[2], color, extra, bevel);
  mesh.position.set(position[0], position[1], position[2]);
  parent.add(mesh);
  return mesh;
}
function addCylinder(parent, rt, rb, h, color, position, segments = 12, extra = {}) {
  const mesh = cylinder(rt, rb, h, color, segments, extra);
  mesh.position.set(position[0], position[1], position[2]);
  parent.add(mesh);
  return mesh;
}
function addPlane(parent, w, h, color, position, extra = {}) {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), extra.material || basic(color, extra));
  mesh.position.set(position[0], position[1], position[2]);
  if (extra.rotation) mesh.rotation.set(extra.rotation[0], extra.rotation[1], extra.rotation[2]);
  parent.add(mesh);
  return mesh;
}
function makeTextTexture(text, options = {}) {
  const canvas = document.createElement('canvas');
  canvas.width = options.width || 512;
  canvas.height = options.height || 128;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = options.background || '#f7f1df';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = options.color || '#24314d';
  ctx.font = `bold ${options.fontSize || 58}px "Noto Sans CJK JP", "Yu Gothic", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}
function addLabel(parent, text, w, h, position, options = {}) {
  const material = new THREE.MeshBasicMaterial({
    map: makeTextTexture(text, options),
    transparent: true,
    depthWrite: false
  });
  const label = new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
  label.position.set(position[0], position[1], position[2]);
  parent.add(label);
  return label;
}
function connectCylinder(parent, a, b, radius, color, segments = 8) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const delta = new THREE.Vector3().subVectors(end, start);
  const mesh = cylinder(radius, radius, delta.length(), color, segments);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
  parent.add(mesh);
  return mesh;
}

// Sidewalks form an L-shaped Japanese street corner.
const sidewalkMat = toon(0x8990a0);
function sidewalk(x, z, w, d) {
  const slab = new THREE.Mesh(new RoundedBoxGeometry(w, 0.16, d, 3, 0.045), sidewalkMat);
  slab.position.set(x, 0.11, z);
  slab.receiveShadow = true;
  slab.castShadow = true;
  diorama.add(slab);
  // Fine tile seams, deliberately subtle rather than a large flat overlay.
  const tileLine = toon(0x6b7489);
  for (let xx = x - w / 2 + 0.72; xx < x + w / 2 - 0.25; xx += 1.42) {
    const seam = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.008, d - 0.12), tileLine);
    seam.position.set(xx, 0.195, z);
    diorama.add(seam);
  }
  for (let zz = z - d / 2 + 0.72; zz < z + d / 2 - 0.25; zz += 1.42) {
    const seam = new THREE.Mesh(new THREE.BoxGeometry(w - 0.12, 0.008, 0.018), tileLine);
    seam.position.set(x, 0.196, zz);
    diorama.add(seam);
  }
}

sidewalk(-5.05, -2.2, 2.25, 5.6);

// Irregular stylized puddles and narrow neon reflections.
const puddleMaterial = new THREE.MeshBasicMaterial({
  color: 0x263c60,
  transparent: true,
  opacity: 0.66,
  depthWrite: false
});
function puddle(x, z, sx, sz, rotation = 0) {
  const shape = new THREE.Shape();
  shape.moveTo(-1, -0.15);
  shape.quadraticCurveTo(-0.85, -0.8, -0.1, -0.72);
  shape.quadraticCurveTo(0.55, -0.92, 0.95, -0.25);
  shape.quadraticCurveTo(1.18, 0.35, 0.35, 0.7);
  shape.quadraticCurveTo(-0.5, 0.82, -0.9, 0.35);
  shape.quadraticCurveTo(-1.2, 0.05, -1, -0.15);
  const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), puddleMaterial);
  mesh.rotation.x = -Math.PI / 2;
  mesh.rotation.y = rotation;
  mesh.scale.set(sx, sz, 1);
  mesh.position.set(x, 0.052, z);
  diorama.add(mesh);
  return mesh;
}
puddle(-4.9, 5.9, 0.8, 0.45, 0.25);
puddle(0.0, 6.6, 1.2, 0.52, -0.2);
puddle(4.3, 4.0, 0.85, 0.38, 0.4);

    new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false })

  mesh.rotation.set(-Math.PI / 2, angle, 0);
  mesh.position.set(x, 0.062, z);
  diorama.add(mesh);
  return mesh;
}

reflection(1.3, 6.0, 2.0, 0xe9a5b3, 0.24, -0.18);

// ------------------------------------------------------------
// Street props: vending machine, bicycles, umbrella stand, trash bin.
// ------------------------------------------------------------
function makeVendingMachine(x, z) {
  const g = new THREE.Group();
  addBox(g, [1.0, 1.92, 0.68], [0, 0.98, 0], 0x315a87, {}, 0.075);
  addBox(g, [0.82, 1.08, 0.045], [0, 1.34, 0.365], 0x1e2a43, { emissive: 0x16365a, emissiveIntensity: 0.55 }, 0.025);
  const drinkColors = [0xe7797c, 0x7bb6d2, 0xe7c46f, 0x79ac8b, 0xd99c69];
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 4; col++) {
      const can = cylinder(0.065, 0.065, 0.19, drinkColors[(row * 4 + col) % drinkColors.length], 10);
      can.position.set(-0.29 + col * 0.19, 1.48 - row * 0.34, 0.405);
      g.add(can);
    }
  }
  addBox(g, [0.82, 0.38, 0.045], [0, 0.54, 0.37], 0x27344e, {}, 0.018);
  addBox(g, [0.5, 0.07, 0.035], [0, 1.86, 0.375], 0xf4d47b, {}, 0.01);
  g.position.set(x, 0.2, z);
  diorama.add(g);
  return g;
}
makeVendingMachine(-4.45, 1.55);

function makeBicycle(x, z, rotation = 0) {
  // One coherent side-profile bicycle. Wheel planes are XY, axles run on Z.
  const g = new THREE.Group();
  const wheelRadius = 0.39;
  const wheelY = 0.43;
  const rearX = -0.58;
  const frontX = 0.58;
  const wheelZ = 0;
  const tireMat = toon(0x252b3b);
  const rimMat = toon(0x9aa8b8);
  const frameColor = 0x4c91b8;
  const wheelGeo = new THREE.TorusGeometry(wheelRadius, 0.035, 8, 28);

  for (const wx of [rearX, frontX]) {
    const wheel = new THREE.Mesh(wheelGeo, tireMat);
    wheel.position.set(wx, wheelY, wheelZ);
    g.add(wheel);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(wheelRadius - 0.055, 0.012, 6, 28), rimMat);
    rim.position.set(wx, wheelY, 0.008);
    g.add(rim);
    // Hub and visible spokes on both sides of each wheel.
    addCylinder(g, 0.055, 0.055, 0.16, 0x69788e, [wx, wheelY, 0], 10);
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4;
      connectCylinder(g,
        [wx, wheelY, 0.055],
        [wx + Math.cos(a) * (wheelRadius - 0.045), wheelY + Math.sin(a) * (wheelRadius - 0.045), 0.055],
        0.007, 0x8794a8, 5);
    }
  }

  // Frame triangle: rear hub -> crank -> seat joint -> head joint -> front hub.
  const rear = [rearX, wheelY, 0.07];
  const crank = [-0.02, 0.43, 0.07];
  const seatJoint = [-0.13, 0.91, 0.07];
  const headJoint = [0.39, 0.82, 0.07];
  connectCylinder(g, rear, crank, 0.027, frameColor);
  connectCylinder(g, crank, seatJoint, 0.027, frameColor);
  connectCylinder(g, seatJoint, rear, 0.027, frameColor);
  connectCylinder(g, seatJoint, headJoint, 0.027, frameColor);
  connectCylinder(g, headJoint, crank, 0.027, frameColor);
  connectCylinder(g, headJoint, [frontX, wheelY, 0.07], 0.027, frameColor);

  // Seat post and saddle.
  connectCylinder(g, seatJoint, [-0.17, 1.04, 0.07], 0.023, 0x41495b);
  addBox(g, [0.34, 0.065, 0.16], [-0.20, 1.07, 0.07], 0x30394b, {}, 0.025);
  // Front fork, steering stem and handlebar.
  connectCylinder(g, headJoint, [0.48, 0.47, 0.07], 0.023, 0x41495b);
  connectCylinder(g, headJoint, [0.43, 1.02, 0.07], 0.025, 0x41495b);
  connectCylinder(g, [0.43, 1.02, 0.07], [0.43, 1.02, -0.23], 0.022, 0x30394b);
  connectCylinder(g, [0.43, 1.02, 0.07], [0.43, 1.02, 0.37], 0.022, 0x30394b);
  // Crank, pedals and chain guard.
  addCylinder(g, 0.065, 0.065, 0.18, 0x59677c, [crank[0], crank[1], 0.07], 10);
  connectCylinder(g, [-0.02, 0.43, 0.17], [-0.18, 0.34, 0.17], 0.018, 0x343d50);
  addBox(g, [0.18, 0.045, 0.10], [-0.22, 0.34, 0.17], 0x343d50, {}, 0.015);
  // Small front lamp and rear reflector.
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.065, 10, 8), basic(0xffe4a0));
  lamp.position.set(0.48, 0.88, 0.12);
  g.add(lamp);
  addBox(g, [0.09, 0.07, 0.07], [-0.68, 0.53, 0.06], 0xd97883, {}, 0.015);

  g.position.set(x, 0.18, z);
  g.rotation.y = rotation;
  diorama.add(g);
  return g;
}
makeBicycle(-5.05, -1.55, -0.15);

// Umbrella stand: compact Japanese-style rack with individually aligned umbrellas.
function makeUmbrellaStand(x, z) {
  const g = new THREE.Group();
  // Weighted circular base and perforated holder.
  addCylinder(g, 0.34, 0.38, 0.16, 0x34445b, [0, 0.08, 0], 12);
  addCylinder(g, 0.29, 0.31, 0.38, 0x53647b, [0, 0.32, 0], 12);
  addCylinder(g, 0.32, 0.32, 0.055, 0x26364e, [0, 0.53, 0], 12);

  const umbrellaColors = [0xd96f83, 0x4f86bd, 0x6e9b83, 0xd7a45d];
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
    const ux = Math.cos(a) * 0.16;
    const uz = Math.sin(a) * 0.16;
    // Handle and shaft share one vertical axis.
    addCylinder(g, 0.014, 0.014, 0.78, 0x41495b, [ux, 0.91, uz], 7);
    const canopy = new THREE.Mesh(
      new THREE.ConeGeometry(0.22, 0.19, 8),
      toon(umbrellaColors[i])
    );
    canopy.position.set(ux, 1.39, uz);
    canopy.rotation.y = a;
    canopy.castShadow = true;
    g.add(canopy);
    // Small curved-looking hook, kept close to the shaft.
    const hook = new THREE.Mesh(
      new THREE.TorusGeometry(0.045, 0.012, 6, 10, Math.PI),
      toon(0x343d50)
    );
    hook.rotation.z = Math.PI;
    hook.position.set(ux, 0.49, uz + 0.025);
    g.add(hook);
  }
  g.position.set(x, 0.18, z);
  diorama.add(g);
  return g;
}
makeUmbrellaStand(3.35, 1.8);

function makeTrashBin(x, z) {

  addBox(g, [0.32, 0.17, 0.035], [0, 0.43, 0.235], 0xe4e1d4, {}, 0.012);
  addLabel(g, 'ごみ', 0.25, 0.11, [0, 0.43, 0.258], { background: '#e4e1d4', color: '#3d534f', fontSize: 48 });

}
makeTrashBin(4.65, 1.55);

// ------------------------------------------------------------
// Street lamp, utility poles, overhead wires and Japanese street sign.
// ------------------------------------------------------------
function makeStreetLamp(x, z) {

makeStreetLamp(-6.65, 3.0);

function makeUtilityPole(x, z) {
  const g = new THREE.Group();
  addCylinder(g, 0.105, 0.14, 5.45, 0x665b58, [0, 2.72, 0], 10);
  addBox(g, [1.5, 0.085, 0.10], [0, 4.72, 0], 0x594f51, {}, 0.025);
  addBox(g, [0.10, 0.08, 1.10], [0, 5.05, 0], 0x594f51, {}, 0.02);
  for (let i = -1; i <= 1; i++) addCylinder(g, 0.055, 0.055, 0.15, 0xc5ac83, [i * 0.48, 4.84, 0], 8);
  addBox(g, [0.48, 0.56, 0.42], [0.28, 3.58, 0], 0x596174, {}, 0.045);

}
makeUtilityPole(6.9, -0.75);
makeUtilityPole(-6.9, -4.35);
function wire(a, b) {
  const curve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(...a),
    new THREE.Vector3((a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 0.55, (a[2] + b[2]) / 2),
    new THREE.Vector3(...b)
  );
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 28, 0.018, 5, false), toon(0x262c40));
  diorama.add(mesh);
}
wire([-6.9, 5.05, -4.35], [6.9, 5.05, -0.75]);
wire([-6.9, 4.72, -4.35], [6.9, 4.72, -0.75]);

function makeStreetSign(x, z) {

}
makeStreetSign(5.5, 3.0);

// Guard rail along the outer corner.
const railGroup = new THREE.Group();
for (let i = 0; i < 5; i++) {
  addBox(railGroup, [0.07, 0.62, 0.07], [-0.95 + i * 0.48, 0.51, 0], 0x8a96a6, {}, 0.018);
}
addBox(railGroup, [2.05, 0.07, 0.08], [0, 0.76, 0], 0xaab3bd, {}, 0.025);
addBox(railGroup, [2.05, 0.07, 0.08], [0, 0.42, 0], 0x778397, {}, 0.025);

// ------------------------------------------------------------
// Narrow alley at the right-rear corner: layered walls, lit windows,

// ------------------------------------------------------------
const alley = new THREE.Group();
addBox(alley, [1.75, 3.5, 2.9], [4.75, 1.75, -5.8], 0x777184);
addBox(alley, [1.65, 3.0, 2.9], [7.0, 1.5, -5.8], 0x5c6079);
addBox(alley, [1.95, 0.18, 3.1], [4.75, 3.55, -5.8], 0x393e5b);
addBox(alley, [1.85, 0.18, 3.1], [7.0, 3.08, -5.8], 0x343a55);
for (let i = 0; i < 2; i++) {
  const win = new THREE.Mesh(new THREE.PlaneGeometry(0.48, 0.62), basic(0xffd28c));

}
addBox(alley, [0.55, 0.8, 0.07], [4.75, 1.0, -4.30], 0x443f55);

// Community notice board with layered paper notices.
const notice = new THREE.Group();
addBox(notice, [1.12, 1.02, 0.12], [0, 1.02, 0], 0x5b4650);
addBox(notice, [0.94, 0.82, 0.035], [0, 1.04, 0.078], 0xe8ddc7);
const flyerColors = [0xe9b6a9, 0xd3dce2, 0xe9d58e];
for (let i = 0; i < 3; i++) {

}
addCylinder(notice, 0.035, 0.035, 0.56, 0x59494a, [-0.42, 0.28, 0], 8);
addCylinder(notice, 0.035, 0.035, 0.56, 0x59494a, [0.42, 0.28, 0], 8);
notice.position.set(-5.45, 0.2, -3.45);
notice.rotation.y = -0.2;
diorama.add(notice);

// ------------------------------------------------------------
// Rain: small, round droplets (not long line segments). Keep density
// restrained and the rain volume close to the diorama so it never veils
// the whole image. Each particle is reset as a complete point.
// ------------------------------------------------------------
const rainCount = 420;
const rainPositions = new Float32Array(rainCount * 3);
const rainSpeeds = new Float32Array(rainCount);
for (let i = 0; i < rainCount; i++) {
  const n = i * 3;
  rainPositions[n] = (Math.random() - 0.5) * 15;
  rainPositions[n + 1] = Math.random() * 6.5;
  rainPositions[n + 2] = (Math.random() - 0.5) * 15;
  rainSpeeds[i] = 0.045 + Math.random() * 0.045;
}
const rainGeometry = new THREE.BufferGeometry();
rainGeometry.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
const rain = new THREE.Points(rainGeometry, new THREE.PointsMaterial({
  color: 0xc5d7f1,
  size: 0.035,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.48,
  depthWrite: false,
  blending: THREE.NormalBlending
}));
scene.add(rain);

// A small number of stylized rain rings around puddles.
const rippleGroup = new THREE.Group();
const rippleMaterial = new THREE.MeshBasicMaterial({ color: 0x9cb8dc, transparent: true, opacity: 0.27, side: THREE.DoubleSide, depthWrite: false });
for (let i = 0; i < 18; i++) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.09, 0.105, 20), rippleMaterial.clone());
  ring.rotation.x = -Math.PI / 2;
  ring.position.set((Math.random() - 0.5) * 12, 0.066, 3.6 + Math.random() * 3.5);
  ring.userData.phase = Math.random() * Math.PI * 2;
  rippleGroup.add(ring);
}
scene.add(rippleGroup);

// ------------------------------------------------------------
// Post-processing: dark ink outlines + restrained neon bloom + FXAA.
// These make the scene read as anime cel-shaded art rather than flat low-poly.
// ------------------------------------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.24,
  0.55,
  0.78
);
composer.addPass(bloomPass);
const outlinePass = new OutlinePass(new THREE.Vector2(window.innerWidth, window.innerHeight), scene, camera);
outlinePass.edgeStrength = 2.15;
outlinePass.edgeGlow = 0.0;
outlinePass.edgeThickness = 1.15;
outlinePass.pulsePeriod = 0;
outlinePass.visibleEdgeColor.set('#20263d');
outlinePass.hiddenEdgeColor.set('#323c5b');
// Select the miniature itself; rain streaks stay unoutlined.
outlinePass.selectedObjects = [diorama];
composer.addPass(outlinePass);
const fxaaPass = new ShaderPass(FXAAShader);
fxaaPass.material.uniforms.resolution.value.set(
  1 / (window.innerWidth * renderer.getPixelRatio()),
  1 / (window.innerHeight * renderer.getPixelRatio())
);
composer.addPass(fxaaPass);
composer.addPass(new OutputPass());

// ------------------------------------------------------------
// Resize / animation.
// ------------------------------------------------------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.04);
  const t = clock.elapsedTime;

  const pos = rainGeometry.attributes.position.array;
  for (let i = 0; i < rainCount; i++) {
    const n = i * 3;
    pos[n + 1] -= rainSpeeds[i] * (dt * 60);
    pos[n] -= 0.006 * (dt * 60);
    if (pos[n + 1] < 0) {
      pos[n] = (Math.random() - 0.5) * 15;
      pos[n + 1] = 5.8 + Math.random() * 1.2;
      pos[n + 2] = (Math.random() - 0.5) * 15;
    }
  }
  rainGeometry.attributes.position.needsUpdate = true;

  rippleGroup.children.forEach((ring) => {
    const pulse = (Math.sin(t * 2.2 + ring.userData.phase) + 1) * 0.5;
    const scale = 0.72 + pulse * 0.6;
    ring.scale.set(scale, scale, 1);
    ring.material.opacity = 0.08 + pulse * 0.2;
  });
  signLight.intensity = 1.08 + Math.sin(t * 2.4) * 0.08;
  controls.update();
  composer.render();
}
animate();

window.addEventListener('resize', () => {
  const aspect = window.innerWidth / window.innerHeight;
  camera.left = -viewHeight * aspect / 2;
  camera.right = viewHeight * aspect / 2;
  camera.top = viewHeight / 2;
  camera.bottom = -viewHeight / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  fxaaPass.material.uniforms.resolution.value.set(
    1 / (window.innerWidth * renderer.getPixelRatio()),
    1 / (window.innerHeight * renderer.getPixelRatio())
  );
});
</script>
