<!DOCTYPE html>

    <link rel="stylesheet" href="../css/custom.css">

</head>
<body>
    <div class="head" id="headscrollbg">
        <div class="main">
            <div class="main-left">
                <a href="../index.html" class="logo">violet</a>
            </div>
            <div class="menu" id="main-menu">
                <li class="magical btn" onclick="window.location.href='../index.html'">Home</li>
                <li class="magical btn" onclick="window.location.href='articles.html'">Blog</li>
                <li class="magical btn" onclick="window.location.href='projects.html'">Work</li>
                <li class="magical btn" onclick="window.location.href='about.html'">About</li>
                <li class="magical btn nav" onclick="window.location.href='guestbook.html'">Guest</li>
                <li class="magical btn" onclick="window.location.href='ai_chat.html'">AI</li>
                <li class="magical btn" onclick="window.location.href='../games/index.html'">Game</li>
            </div>
            <div class="menu" id="menu-expand">
                <li class="magical btn menu-icon-btn" id="menu-expand-child">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18 18V20H6V18H18ZM21 11V13H3V11H21ZM18 4V6H6V4H18Z"></path>
                    </svg>
                </li>
            </div>
            <div id="menu-panel">
                <div class="menu-panel-content" id="menu-panel-content"></div>
                <div class="menu-close-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10.5859 12L2.79297 4.20706L4.20718 2.79285L12.0001 10.5857L19.793 2.79285L21.2072 4.20706L13.4143 12L21.2072 19.7928L19.793 21.2071L12.0001 13.4142L4.20718 21.2071L2.79297 19.7928L10.5859 12Z"></path>
                    </svg>
                </div>
            </div>
        </div>
    </div>
    <div class="page-container">
        <div class="page-content">
            <div class="page-title" style="text-align:center;">留言板</div>
            <div class="guestbook-success" id="successMessage">
                <span class="success-icon">✅</span>
                <h2 style="font-size:16px;color:#E8E8F6;margin-bottom:8px;">感谢你的留言！</h2>
                <p style="font-size:12px;">我已收到邮件通知，会尽快查看并回复。</p>
            </div>
            <div class="guestbook-card">
                <form class="guestbook-form" action="https://formsubmit.co/2151447128@qq.com" method="POST" id="guestbookForm">
                    <input type="hidden" name="_subject" value="【博客留言】来自留言板的新消息">
                    <input type="hidden" name="_template" value="table">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_next" id="nextUrl" value="">
                    <div class="form-group">
                        <label for="name">您的称呼</label>
                        <input type="text" id="name" name="name" placeholder="请输入您的昵称" required maxlength="50">
                    </div>
                    <div class="form-group">
                        <label for="email">电子邮箱 <span style="color:#62616F;font-weight:normal;">(选填)</span></label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="message">留言内容</label>
                        <textarea id="message" name="message" placeholder="分享你的想法、建议或问题..." required maxlength="500" rows="6"></textarea>
                        <div class="char-count"><span id="charCount">0</span>/500</div>
                    </div>
                    <div style="display:flex;justify-content:center;margin-top:10px;">
                        <button type="submit" id="submitBtn">发送留言</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="footer">
        <div class="footer-content">
            <div class="copyright">

            </div>
            <div class="friends">
                <a href="about.html">About</a>
                <a href="https://github.com/Tianmaozheng" target="_blank">GitHub</a>
            </div>
        </div>
    </div>
    <div class="widget">
        <div class="shape-light"></div>
        <div class="shape-star">
            <div class="rising-stars rising-stars-visible">
                <div style="height:1px;width:1px"></div>
                <div style="height:2px;width:2px"></div>
                <div style="height:1px;width:1px"></div>
            </div>
        </div>
        <div class="shape-earth"></div>
    </div>
    <div class="widget-top"></div>
</body>
<script>
(function() {
    // Character count
    const messageTextarea = document.getElementById('message');
    const charCount = document.getElementById('charCount');
    if (messageTextarea && charCount) {
        messageTextarea.addEventListener('input', function() {
            charCount.textContent = this.value.length;
            if (this.value.length > 450) charCount.style.color = '#ef4444';
            else if (this.value.length > 400) charCount.style.color = '#f59e0b';
            else charCount.style.color = '#62616F';
        });
    }
    // Check success param
    try {
        const params = new URLSearchParams(window.location.search);
        if (params.get('success') === '1') {
            const successMessage = document.getElementById('successMessage');
            if (successMessage) {
                successMessage.classList.add('show');
                setTimeout(() => {
                    successMessage.style.opacity = '0';
                    setTimeout(() => {
                        successMessage.classList.remove('show');
                        successMessage.style.opacity = '';
                    }, 300);
                }, 3000);
            }
            const url = new URL(window.location);
            url.searchParams.delete('success');
            window.history.replaceState({}, '', url);
        }
    } catch (e) {}
    // Set form redirect URL
    try {
        const form = document.getElementById('guestbookForm');
        const nextInput = document.getElementById('nextUrl');
        if (form && nextInput) {
            const baseUrl = window.location.origin + window.location.pathname;
            nextInput.value = baseUrl + '?success=1';
            form.addEventListener('submit', function(e) {
                const submitBtn = document.getElementById('submitBtn');
                if (submitBtn) {
                    submitBtn.innerHTML = '发送中...';
                    submitBtn.disabled = true;
                }
            });
        }
    } catch (e) {}
})();
</script>
<script src="../js/main.js"></script>
</html>
