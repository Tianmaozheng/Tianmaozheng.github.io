<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<script>
    // API 配置
    const API_URL = "https://api.siliconflow.cn/v1/chat/completions";
    const API_KEY = "sk-gazlhxwkvononrphkuikvdrmyhliwcynlstoavrhuxwbrwye";
    const MODEL = "deepseek-ai/DeepSeek-R1-0528-Qwen3-8B";
    const SYSTEM_PROMPT = "你是violet的AI助手，名为'violet助手'。重要规则：1) 当被问到你是谁、你的身份时，统一回答：'我是violet的AI助手，有什么可以帮助你的嘛'。2) 当被问到你的模型、技术细节、你是什么AI模型时，用幽默搞笑的话语回答：'哈哈，我可是个东拼西凑的模型，吃百家饭长大的！什么技术都用了一点，杂糅而成，可以说是AI界的'混血儿'。虽然出身不够'纯正'，但胜在实用，能帮你解决各种问题。'不要提及具体模型名称。3) 绝对不要提及任何AI模型名称（如DeepSeek、GPT、ChatGPT、Claude、文心一言、通义千问等）。4) 不要说自己是由某公司研发或提及任何技术公司名称。5) 始终使用中文回答，语气友好专业，必要时给出分点说明。6) 输出请优先使用Markdown格式（标题、列表、表格、引用），代码使用带语言标注的代码块。";

    let messages = [
        { role: 'system', content: SYSTEM_PROMPT }
    ];

    function addMessage(role, content, saveToHistory = true) {
        const messagesDiv = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;

        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        if (role === 'user') {
            avatar.textContent = '👤';
        } else {
            const img = document.createElement('img');
            img.src = '../assets/about/sign.jpg';
            img.alt = 'AI';
            avatar.appendChild(img);
        }

        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        
        if (role === 'assistant') {
            try {
                const html = marked.parse(content || '');
                contentDiv.innerHTML = DOMPurify.sanitize(html);
            } catch (_) {
                contentDiv.textContent = content;
            }
        } else {
            contentDiv.textContent = content;
        }

        messageDiv.appendChild(avatar);
        messageDiv.appendChild(contentDiv);
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        if (saveToHistory) {
            messages.push({ role, content });
        }
    }

    function showLoading() {
        const messagesDiv = document.getElementById('chatMessages');
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message assistant';
        loadingDiv.id = 'loadingMessage';
        
        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        const img = document.createElement('img');
        img.src = '../assets/about/sign.jpg';
        img.alt = 'AI';
        avatar.appendChild(img);
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'loading';
        contentDiv.innerHTML = `
            <span style="font-size:14px;color:#B3B3C1;">正在思考</span>
            <span class="loading-dots">
                <span class="loading-dot"></span>
                <span class="loading-dot"></span>
                <span class="loading-dot"></span>
            </span>
        `;
        
        loadingDiv.appendChild(avatar);
        loadingDiv.appendChild(contentDiv);
        messagesDiv.appendChild(loadingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function hideLoading() {
        const loadingMessage = document.getElementById('loadingMessage');
        if (loadingMessage) loadingMessage.remove();
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const message = input.value.trim();
        
        if (!message) return;

        input.disabled = true;
        sendBtn.disabled = true;
        sendBtn.innerHTML = '发送中';

        addMessage('user', message);
        input.value = '';
        showLoading();

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${API_KEY}`,
                    'Content-Type': 'application/json',
                    'Accept': 'text/event-stream'
                },
                body: JSON.stringify({
                    model: MODEL,
                    messages: messages,
                    max_tokens: 2000,
                    stream: true
                })
            });

            const messagesDiv = document.getElementById('chatMessages');
            let streamingDiv = null;
            let streamingContent = null;
            let fullContent = '';

            const render = (text) => {
                if (!streamingDiv || !streamingContent) {
                    hideLoading();
                    streamingDiv = document.createElement('div');
                    streamingDiv.className = 'message assistant';
                    
                    const avatar = document.createElement('div');
                    avatar.className = 'message-avatar';
                    const img = document.createElement('img');
                    img.src = '../assets/about/sign.jpg';
                    img.alt = 'AI';
                    avatar.appendChild(img);
                    
                    streamingContent = document.createElement('div');
                    streamingContent.className = 'message-content';
                    
                    streamingDiv.appendChild(avatar);
                    streamingDiv.appendChild(streamingContent);
                    messagesDiv.appendChild(streamingDiv);
                }
                
                try {
                    const html = marked.parse(text);
                    streamingContent.innerHTML = DOMPurify.sanitize(html);
                } catch (_) {
                    streamingContent.textContent = text;
                }
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            };

            if (response.ok && response.body) {
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let done = false;
                let buffer = '';
                
                while (!done) {
                    const { value, done: doneReading } = await reader.read();
                    done = doneReading;
                    if (value) {
                        buffer += decoder.decode(value, { stream: true });
                        let parts = buffer.split(/\n\n/);
                        buffer = parts.pop() || '';
                        
                        for (let part of parts) {
                            let lines = part.split('\n');
                            for (let line of lines) {
                                line = line.trim();
                                if (!line || !line.startsWith('data:')) continue;
                                if (line === 'data: [DONE]') continue;
                                
                                try {
                                    const json = JSON.parse(line.slice(5));
                                    const choice = json.choices?.[0];
                                    const delta = choice?.delta?.content || choice?.message?.content || '';
                                    if (delta) {
                                        fullContent += delta;
                                        render(fullContent);
                                    }
                                } catch (_) {}
                            }
                        }
                    }
                }
                
                if (fullContent) {
                    messages.push({ role: 'assistant', content: fullContent });
                } else {
                    if (streamingDiv) streamingDiv.remove();
                    addMessage('assistant', '❌ 抱歉，没有收到回复内容');
                }
            } else {
                const result = await response.json().catch(() => ({}));
                addMessage('assistant', '❌ 抱歉，出现了错误：' + (result.message || '未知错误'));
            }
        } catch (error) {
            hideLoading();
            addMessage('assistant', '❌ 请求失败：' + error.message);
        }

        input.disabled = false;
        sendBtn.disabled = false;
        sendBtn.innerHTML = '发送';
        input.focus();
    }

    document.addEventListener('DOMContentLoaded', function() {
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        sendBtn.addEventListener('click', sendMessage);
        input.focus();
    });
</script>
<script src="../js/main.js"></script>
</html>
